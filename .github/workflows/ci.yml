name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm test

  publish:
    # Stages a release when a push to main changes the version,
    # and it becomes public after `npm stage approve`.
    if: github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if the version changed
        id: version
        run: |
          before=$(git show ${{ github.event.before }}:package.json 2>/dev/null | jq -r .version || true)
          version=$(jq -r .version package.json)
          published=$(npm view "node-test-mocha-reporter@$version" version 2>/dev/null || true)

          if [ "$version" != "$before" ] && [ -z "$published" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js 24
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - if: steps.version.outputs.changed == 'true'
        run: npm stage publish --provenance
